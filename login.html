<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Learnova</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom, #4b0082 0%, #9999ff 100%);;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
        background: white;
        padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      width: 350px;
    }

    h2 {
      margin-bottom: 5px;
      color: #1a1a1a;
    }

    .subtext {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .subtext a {
      color: #4b2aad;
      text-decoration: none;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .checkbox-group input {
      margin-right: 8px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #4b2aad;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .google-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .google-btn img {
      width: 18px;
      height: 18px;
    }

    .forgot {
      text-align: center;
      font-size: 14px;
    }

    .forgot a {
      color: #4b2aad
      text-decoration none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Sign in</h2>
    <div class="subtext">or <a href="signup.html">create an account</a></div>

    <input type="email" id="email" class="input-field" placeholder="Email">
    <input type="password" id="password" class="input-field" placeholder="Password">

    <div class="checkbox-group">
      <input type="checkbox" id="remember">
      <label for="remember">Remember me</label>
    </div>

    <button class="btn">Login</button>
    <div id="g_id_onload"
     data-client_id="428767959991-p7p93mgtlbbi9gigoge0sfe8i69mkm4j.apps.googleusercontent.com"
     data-login_uri="https://localhost:5500/oauth2callback"
     data-auto_prompt="false">
</div>
<div class="g_id_signin"
     data-type="standard"
     data-size="large"
     data-theme="outline"
     data-text="sign_in_with"
     data-shape="rectangular"
     data-logo_alignment="left">
</div &#8203;:contentReference[oaicite:6]{index=6}>


    <div class="forgot">
      <a href="#">Forgotten your password?</a>
    </div>
  </div>

  <script>
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert(data.message);
                window.location.href = 'home.html';
            } else {
                alert(data.message);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred during login.');
        }
    }
</script>
<script src="login.js"></script>

</body>
</html>
